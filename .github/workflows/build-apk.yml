name: Build Pelican Mods APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PelicanMods-Android-Starter.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q PelicanMods-Android-Starter.zip

      - name: Build debug APK
        working-directory: PelicanMods
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PelicanMods-debug-apk
          path: PelicanMods/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
